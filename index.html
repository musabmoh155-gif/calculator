<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="calculator">
        <input id="display" readonly>
        <div id="keys">
            <button onclick="AppendToDisplay('+')" id="plusbtn">+</button>
            <button onclick="AppendToDisplay('9')">9</button>
            <button onclick="AppendToDisplay('8')">8</button>
            <button onclick="AppendToDisplay('7')">7</button>
            <button onclick="AppendToDisplay('*')" id="timesbtn">*</button>
            <button onclick="AppendToDisplay('6')">6</button>
            <button onclick="AppendToDisplay('5')">5</button>
            <button onclick="AppendToDisplay('4')">4</button>
            <button onclick="AppendToDisplay('/')" id="divbtn">/</button>
            <button onclick="AppendToDisplay('3')">3</button>
            <button onclick="AppendToDisplay('2')">2</button>
            <button onclick="AppendToDisplay('1')">1</button>
            <button onclick="AppendToDisplay('0')">0</button>
            <button onclick="calculate()" id="equalbtn">=</button>
            <button onclick="ClearDisplay()" id="clearbtn">C</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
